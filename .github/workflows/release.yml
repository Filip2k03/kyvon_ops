name: Production Multi-Platform Release

permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - 'v*'

jobs:
  # `agent/` currently holds only bootstrap.sh, which pipes a POSIX collector
  # over stdin; the compiled musl agent crate does not exist yet. Building it
  # unconditionally made every tag push fail on a missing manifest, and because
  # the desktop bundles declared `needs: build-agent-matrix`, no release could
  # ever be produced. This job now detects the crate and skips cleanly until it
  # lands, rather than blocking the desktop and mobile artifacts behind it.
  detect-agent:
    name: Detect Agent Crate
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f agent/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/Cargo.toml not present; skipping the musl agent build."
          fi

  quality:
    name: Validate Release Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Validate Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Validate desktop frontend
        run: |
          cd apps/desktop
          bun install --frozen-lockfile
          bun run build
          bun test tests/

  build-agent-matrix:
    name: Build Static Musl Agents
    needs: detect-agent
    if: needs.detect-agent.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabi
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Cross Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build Agent Binary
        run: cross build --target ${{ matrix.target }} --release --manifest-path agent/Cargo.toml
      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: agent/target/${{ matrix.target }}/release/kyvon-agent

  build-desktop-apps:
    needs: [detect-agent, quality, build-agent-matrix]
    # `always()` so a skipped agent build does not cascade into a skipped
    # desktop build; the guard still blocks the release if source validation
    # fails or the optional agent job ran and genuinely failed.
    if: always() && needs.quality.result == 'success' && needs.build-agent-matrix.result != 'failure'
    name: Build Desktop Bundles (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Linux Build Toolchain
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download Staged Agent Binaries
        if: needs.detect-agent.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          path: apps/desktop/src-tauri/binaries/

      - name: Install Desktop Dependencies
        run: cd apps/desktop && bun install --frozen-lockfile

      - name: Build Desktop Bundle
        working-directory: apps/desktop
        run: bun run tauri build ${{ matrix.args }}

      - name: Upload installer files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/nsis/*.exe
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb

  checksums:
    name: SHA-256 manifests
    needs: build-desktop-apps
    if: needs.build-desktop-apps.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Generate and verify SHA256SUMS
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            sha256sum "$file" | awk -v name="$name" '{print $1 "  " name}'
          done | sort -u > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          while read -r digest name; do
            file="$(find dist -type f -name "$name" -print -quit)"
            test -n "$file"
            printf '%s  %s\n' "$digest" "$file"
            printf '%s  %s\n' "$digest" "$file" | sha256sum -c -
          done < SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt

      - name: Download release files into one directory
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish draft prerelease with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print | sort)
          test "${#assets[@]}" -gt 0
          cp SHA256SUMS.txt release-assets/SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --prerelease \
            --title "KyvonOPS ${GITHUB_REF_NAME}" \
            --notes "V4.1 desktop prerelease. Assets were built from ${GITHUB_SHA}; verify SHA256SUMS.txt before installation. Signing and clean-install verification remain release gates."
