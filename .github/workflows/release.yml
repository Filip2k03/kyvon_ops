name: Production Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # `agent/` currently holds only bootstrap.sh, which pipes a POSIX collector
  # over stdin; the compiled musl agent crate does not exist yet. Building it
  # unconditionally made every tag push fail on a missing manifest, and because
  # the desktop bundles declared `needs: build-agent-matrix`, no release could
  # ever be produced. This job now detects the crate and skips cleanly until it
  # lands, rather than blocking the desktop and mobile artifacts behind it.
  detect-agent:
    name: Detect Agent Crate
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f agent/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/Cargo.toml not present; skipping the musl agent build."
          fi

  quality:
    name: Validate Release Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Validate Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Validate desktop frontend
        run: |
          cd apps/desktop
          bun install --frozen-lockfile
          bun run build
          bun test tests/public-website.test.tsx

  build-agent-matrix:
    name: Build Static Musl Agents
    needs: detect-agent
    if: needs.detect-agent.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabi
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Cross Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build Agent Binary
        run: cross build --target ${{ matrix.target }} --release --manifest-path agent/Cargo.toml
      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: agent/target/${{ matrix.target }}/release/kyvon-agent

  build-desktop-apps:
    needs: [detect-agent, quality, build-agent-matrix]
    # `always()` so a skipped agent build does not cascade into a skipped
    # desktop build; the guard still blocks the release if source validation
    # fails or the optional agent job ran and genuinely failed.
    if: always() && needs.quality.result == 'success' && needs.build-agent-matrix.result != 'failure'
    name: Build Desktop Bundles (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Toolchain
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Download Staged Agent Binaries
        if: needs.detect-agent.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          path: apps/desktop/src-tauri/binaries/

      - name: Install Desktop Dependencies
        run: cd apps/desktop && bun install

      - name: Build and Sign Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'KyvonOPS ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
