[package]
name = "kyvon-ops"
version = "0.1.0"
description = "KyvonOPS Desktop Backend"
authors = ["Kyvon"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
kyvon-core = { path = "../../../crates/kyvon-core" }
kyvon-security = { path = "../../../crates/kyvon-security" }
kyvon-ssh = { path = "../../../crates/kyvon-ssh" }
kyvon-storage = { path = "../../../crates/kyvon-storage" }
kyvon-telemetry = { path = "../../../crates/kyvon-telemetry" }
