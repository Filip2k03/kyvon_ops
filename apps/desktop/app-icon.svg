<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#181b26"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#232738" stroke-width="8"/>

  <!-- Subtle Cybernetic Hex Grid / Isometric Lines -->
  <path d="M256 96 L416 188 L416 324 L256 416 L96 324 L96 188 Z" fill="none" stroke="#232738" stroke-width="4" opacity="0.6"/>
  <path d="M256 96 L256 416" stroke="#232738" stroke-width="3" opacity="0.4"/>
  <path d="M96 188 L416 324" stroke="#232738" stroke-width="3" opacity="0.3"/>
  <path d="M416 188 L96 324" stroke="#232738" stroke-width="3" opacity="0.3"/>

  <!-- Server Blades Chassis (3D Isometric Stack) -->
  <!-- Top Blade -->
  <path d="M256 128 L384 200 L256 272 L128 200 Z" fill="#161b26" stroke="#38bdf8" stroke-width="6"/>
  <!-- Middle Blade -->
  <path d="M128 224 L256 296 L384 224 L384 248 L256 320 L128 248 Z" fill="#12141c" stroke="#38bdf8" stroke-width="5" opacity="0.9"/>
  <!-- Bottom Blade -->
  <path d="M128 272 L256 344 L384 272 L384 296 L256 368 L128 296 Z" fill="#090a0f" stroke="#0284c7" stroke-width="5" opacity="0.8"/>

  <!-- Holographic Core Node (Top Center) -->
  <circle cx="256" cy="200" r="28" fill="#090a0f" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="200" r="12" fill="url(#cyanGrad)"/>

  <!-- Satellites & Data Beams -->
  <line x1="256" y1="200" x2="192" y2="164" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="192" cy="164" r="10" fill="#34d399" filter="url(#glow)"/>

  <line x1="256" y1="200" x2="320" y2="164" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="320" cy="164" r="10" fill="#fbbf24" filter="url(#glow)"/>

  <line x1="256" y1="200" x2="256" y2="272" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="272" r="8" fill="#38bdf8"/>

  <!-- Status Indicator Ring -->
  <circle cx="410" cy="102" r="18" fill="#090a0f" stroke="#34d399" stroke-width="4"/>
  <circle cx="410" cy="102" r="9" fill="#34d399" filter="url(#glow)"/>
</svg>
